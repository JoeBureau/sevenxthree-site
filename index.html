<style>
  :root {
    --bg: #0d1420;
    --line: rgba(255, 255, 255, 0.10);
    --ink: #eef3f8;
    --ink-dim: #93a4b8;

    /* The sevenXthree brand ramp.
       OWNED BY packages/ui/src/theme.ts (BRAND) in the speech-platform monorepo.
       These are copies; anything here that disagrees with that file is a bug.

       This file used to hold #1f6fb2 / #2bb3b3 / #5fb83a — not one of them a
       brand colour, each a desaturated approximation with lime missing entirely.
       That mattered beyond this page: the iOS app copied these three in good
       faith, Android mirrored iOS, and both app icons were built from them, so
       four downstream copies were wrong because this one was. Fix the monorepo
       token first and copy from there, never from here.

       All four are listed even though --brand-a has no direct use on this page:
       clipped text takes --brand-a-text below, and the blue glow takes the
       channel triple. The ramp is only legible as a set, and this file is what
       downstream copies get read from, so the reference value stays. */
    --brand-a: #0073d6;  /* BRAND.blue  — reference; see --brand-a-text */
    --brand-b: #00b7e8;  /* BRAND.cyan  */
    --brand-c: #1ecc5a;  /* BRAND.green */
    --brand-d: #66d132;  /* BRAND.lime  */

    /* The same colours as channel triples. The translucent glow layers used to
       hand-write rgba(31, 111, 178, …), which is how they silently kept the old
       values even where a var would have been updated. */
    --brand-a-rgb: 0 115 214;
    --brand-b-rgb: 0 183 232;
    --brand-c-rgb: 30 204 90;

    /* Gradient-clipped text on this dark ground takes the tinted blue, matching
       BRAND_GRADIENT_TEXT. BRAND.blue itself is 3.89:1 on #0d1420 — over the 3:1
       large-text floor but under 4.5:1 — where this is 6.21:1 and safe at any
       size. */
    --brand-a-text: #2e9bf0;

    --focus: #00b7e8;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.65 ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Soft brand glow behind the fold. Decorative only. */
  body::before {
    content: "";
    position: fixed;
    inset: -20% -10% auto -10%;
    height: 70vh;
    background:
      radial-gradient(50% 60% at 22% 0%, rgb(var(--brand-a-rgb) / 0.30), transparent 70%),
      radial-gradient(45% 55% at 68% 8%, rgb(var(--brand-b-rgb) / 0.22), transparent 72%),
      radial-gradient(40% 50% at 92% 0%, rgb(var(--brand-c-rgb) / 0.14), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 46rem;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  header { padding-top: clamp(3rem, 12vh, 7rem); }

  /* ---- Wordmark ---- */
  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    margin-bottom: clamp(2rem, 6vh, 3.25rem);
  }

  .brand__mark {
    flex: none;
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.7rem;
  }

  .brand__name {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand__name b {
    font-weight: 600;
    /* background-IMAGE, not the `background` shorthand: the shorthand resets
       background-clip, and the letter then paints as a coloured block instead of
       a coloured glyph. Stops sit at 0/44/72/100 — the ramp's real positions,
       measured off the wordmark artwork — not at even thirds, which is what made
       the ramp read green. */
    background-image: linear-gradient(100deg,
      var(--brand-a-text) 0%, var(--brand-b) 44%, var(--brand-c) 72%, var(--brand-d) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---- Hero ---- */
  .lede {
    margin: 0 0 2.75rem;
    font-size: clamp(2.25rem, 9vw, 3.75rem);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.025em;
  }

  .lede em {
    font-style: normal;
    background-image: linear-gradient(100deg, var(--brand-b), var(--brand-c));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* Dots stay solid ink so the gradient reads as the words alone. */
  .lede__dots { color: var(--ink-dim); }

  /* ---- Contact ---- */
  .contact {
    padding-top: 2rem;
    border-top: 1px solid var(--line);
  }

  .contact__label {
    margin: 0 0 0.35rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid rgb(var(--brand-b-rgb) / 0.55);
    padding-bottom: 1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  a:hover { color: var(--brand-b); border-bottom-color: var(--brand-b); }

  a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .contact a { font-size: 1.08rem; }

  /* ---- Footer ---- */
  footer {
    position: relative;
    z-index: 1;
    margin-top: auto;
    padding: 3.5rem 0 2rem;
    font-size: 0.82rem;
    color: var(--ink-dim);
  }

  footer p { margin: 0; }

  /* The open-source attribution. Served by Studio rather than duplicated here:
     it is generated from the real dependency graphs and one copy cannot drift. */
  footer .footer-links { margin-top: 0.6rem; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <img class="brand__mark" src="/favicon.svg" alt="" width="44" height="44">
      <p class="brand__name">seven<b>X</b>three</p>
    </div>

    <h1 class="lede"><em>Coming soon</em><span class="lede__dots" aria-hidden="true">...</span></h1>
  </header>

  <main class="contact">
    <p class="contact__label">Contact</p>
    <p><a href="mailto:support@sevenxthree.com">support@sevenxthree.com</a></p>
  </main>
</div>

<footer>
  <div class="wrap">
    <p>&copy; 2026 sevenXthree. All rights reserved.</p>
    <p class="footer-links">
      <a href="https://studio.sevenxthree.com/legal/notices">Third-party notices</a>
    </p>
  </div>
</footer>

</body>
</html>
