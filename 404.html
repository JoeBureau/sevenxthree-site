<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — sevenXthree</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0d1420">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0d1420; --ink:#eef3f8; --ink-dim:#93a4b8; --brand-b:#00b7e8; --brand-b-rgb:0 183 232; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.65 ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  img { width: 3rem; height: 3rem; border-radius: 0.75rem; }
  h1 {
    margin: 1.5rem 0 0.5rem;
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  p { margin: 0 0 1.75rem; color: var(--ink-dim); }
  a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid rgb(var(--brand-b-rgb) / 0.55);
    padding-bottom: 1px;
  }
  a:hover { color: var(--brand-b); border-bottom-color: var(--brand-b); }
  a:focus-visible { outline: 2px solid var(--brand-b); outline-offset: 3px; }
</style>
</head>
<body>
  <div>
    <img src="/favicon.svg" alt="" width="48" height="48">
    <h1>Page not found</h1>
    <p>That page doesn&rsquo;t exist or has moved.</p>
    <p><a href="/">Return home</a></p>
  </div>
</body>
</html>
